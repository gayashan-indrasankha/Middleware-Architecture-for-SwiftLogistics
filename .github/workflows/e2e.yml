name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Run end-to-end suite
        shell: pwsh
        run: ./tests/e2e.ps1

      - name: Check WebSocket isolation
        run: node tests/ws-isolation.mjs

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
